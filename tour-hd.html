<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>空間預覽｜山遇莊園民宿</title>
  <link rel="canonical" href="https://shanyu2015.com/tour.html">
  <script>
    const destination=new URL('tour.html',location.href);
    const params=new URLSearchParams(location.search),fragment=location.hash.slice(1);
    const views=['estate','yunsidai','lihalai','zhenqing','cabin'];
    const view=params.get('view')||fragment;
    if(views.includes(view))destination.searchParams.set('view',view);
    if(['cabin-ground','cabin-upper'].includes(fragment)){
      destination.searchParams.set('view','cabin');
      destination.searchParams.set('level',fragment.slice(6));
    }else if(view==='cabin'&&['all','ground','upper'].includes(params.get('level'))){
      destination.searchParams.set('level',params.get('level'));
    }
    location.replace(destination.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=tour.html"></noscript>
</head>
<body><p><a href="tour.html">前往山遇空間預覽</a></p></body>
</html>
