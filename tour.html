<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>立體導覽｜山遇莊園民宿</title>
  <link rel="icon" href="assets/icon/icon-96.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
  <link rel="stylesheet" href="tour.css?v=20260906">
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body class="tour-standalone">
  <section class="hero3d" id="hero3d" aria-label="山遇莊園立體導覽">
    <header class="tour-head">
      <div><div class="en">SHANYU · THE ESTATE</div><h1>山遇・立體導覽</h1></div>
      <a class="tour-back" href="./#hero3d">返回山遇首頁</a>
    </header>
    <div class="tour-tabs" role="tablist" aria-label="莊園與房型"></div>
    <div class="tour-stage" id="tour-stage" role="tabpanel">
      <canvas tabindex="0" aria-label="山遇莊園立體模型"></canvas>
      <div class="hero3d-load"><img src="assets/hero-house.jpg" alt="山遇莊園主棟實景"><button type="button">載入立體導覽</button></div>
    </div>
    <footer class="tour-footer"><div><strong class="tour-current">莊園全景</strong><span class="tour-detail">主棟・庭園・池畔木屋</span></div><p>依實景照片重現<br>建築與配置為示意</p></footer>
  </section>
  <script type="module">
    const section=document.querySelector('.hero3d'),button=section.querySelector('.hero3d-load button');
    let loading=false;
    async function start(){
      if(loading)return;loading=true;button.textContent='載入中…';
      try{const {mountTour}=await import('./tour-ui.js?v=20260906-3');mountTour(section);}
      catch(error){button.textContent='載入失敗，請重試';loading=false;console.error(error);}
    }
    button.addEventListener('click',start);start();
  </script>
</body>
</html>
