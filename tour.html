<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>立體導覽｜山遇莊園民宿</title>
  <link rel="icon" href="assets/icon/icon-96.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
  <link rel="stylesheet" href="tour.css?v=20260907-2">
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body class="tour-standalone">
  <section class="hero3d" id="hero3d" aria-label="山遇莊園立體導覽">
    <header class="tour-head">
      <div><div class="en">SHANYU · THE ESTATE</div><h1>山遇・立體導覽</h1></div>
      <a class="tour-back" href="./#hero3d">返回山遇首頁</a>
    </header>
    <div class="tour-tabs" role="tablist" aria-label="莊園與房型"></div>
    <div class="tour-layout">
    <div class="tour-stage" id="tour-stage" role="tabpanel">
      <canvas tabindex="0" aria-label="山遇莊園立體模型"></canvas>
      <div class="hero3d-load"><img src="assets/hero-house.jpg" alt="山遇莊園主棟實景"><button type="button">載入立體導覽</button></div>
    </div>
    <aside class="tour-prices" aria-label="住宿房價">
      <div class="tour-price-heading"><h3>住宿房價</h3><span>NT$ / 晚</span></div>
      <table>
        <caption class="tour-sr-only">各房型每晚房價，新臺幣</caption>
        <thead><tr><th scope="col">房型</th><th scope="col">平日</th><th scope="col">春節</th></tr></thead>
        <tbody>
          <tr data-rate="yunsidai"><th scope="row"><button type="button" data-room="yunsidai" aria-label="查看雲絲帶立體模型" disabled>雲絲帶</button><span>3 人房</span></th><td>2,500</td><td>3,500</td></tr>
          <tr data-rate="lihalai"><th scope="row"><button type="button" data-room="lihalai" aria-label="查看里哈籟立體模型" disabled>里哈籟</button><span>2 至 4 人房</span></th><td>3,000</td><td>4,000</td></tr>
          <tr data-rate="zhenqing"><th scope="row"><button type="button" data-room="zhenqing" aria-label="查看山遇真情立體模型" disabled>山遇真情</button><span>4 人房</span></th><td>4,500</td><td>5,500</td></tr>
          <tr data-rate="cabin"><th scope="row"><button type="button" data-room="cabin" aria-label="查看水見曉逐立體模型" disabled>水見曉逐</button><span>獨棟木屋</span></th><td>5,500</td><td>6,500</td></tr>
        </tbody>
      </table>
      <div class="tour-whole-house"><h4>包棟 <span>11 人</span></h4><dl><div><dt>平日</dt><dd>NT$10,000</dd></div><div><dt>春節</dt><dd>NT$13,000</dd></div></dl></div>
      <p class="tour-rate-note">實際訂房金額以民宿確認為準</p>
    </aside>
    </div>
    <footer class="tour-footer"><div><strong class="tour-current">莊園全景</strong><span class="tour-detail">主棟・庭園・池畔木屋</span></div><p>依實景照片重現<br>建築與配置為示意</p></footer>
  </section>
  <script type="module">
    const section=document.querySelector('.hero3d'),button=section.querySelector('.hero3d-load button');
    let loading=false;
    async function start(){
      if(loading)return;loading=true;button.textContent='載入中…';
      try{const {mountTour}=await import('./tour-ui.js?v=20260908-1');mountTour(section);}
      catch(error){button.textContent='載入失敗，請重試';loading=false;console.error(error);}
    }
    button.addEventListener('click',start);start();
  </script>
</body>
</html>
